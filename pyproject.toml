[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rul-eval-audit"
version = "0.1.0"
description = "Reproducible audit of C-MAPSS RUL evaluation protocols"
requires-python = ">=3.11,<3.12"
dependencies = [
  "lightgbm>=4.3,<5",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pingouin>=0.5.4,<0.6",
  "pyarrow>=15,<22",
  "pyyaml>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "statsmodels>=0.14,<0.15",
  "torch>=2.2,<3",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = [
  "pypdf>=5,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
