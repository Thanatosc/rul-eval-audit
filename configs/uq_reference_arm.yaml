methods:
  residual_split_cp:
    source_output_mode: point
    score: abs_true_rul_minus_pred_rul
    interval: pred_rul_plus_or_minus_qhat
  cqr:
    source_output_mode: quantile
    base_quantiles: [0.10, 0.90]
    score: max_pred_q10_minus_true_rul_or_true_rul_minus_pred_q90
    interval: pred_q10_minus_qhat_to_pred_q90_plus_qhat

calibration:
  alpha: 0.10
  nominal_coverage: 0.90
  score_population: all_complete_calibration_windows_pooled
  finite_sample_rank: ceil_of_n_plus_1_times_one_minus_alpha
  order_statistic_indexing: one_based
  ties: nonrandomized_higher_order_statistic
  target_support_clipping: false
  calibration_units: engine_disjoint_from_train_and_val
  validity_label: empirical_reference_not_strict_window_level_certificate
  limitation: overlapping_windows_within_engine_are_not_exchangeable_independent_examples

evaluation:
  primary_population: all_complete_official_test_windows
  primary_aggregation: equal_engine_mean_of_within_engine_coverage_and_width
  primary_metrics: [engine_balanced_coverage, engine_balanced_mean_interval_width]
  secondary_metrics:
    - pooled_window_coverage
    - pooled_window_mean_interval_width
    - endpoint_coverage
    - endpoint_mean_interval_width
  interval_inclusion: closed_lower_and_upper
  inference_unit: official_test_engine
  bootstrap:
    type: paired_engine_cluster_percentile
    resamples: 20000
    seed: 20260812
    confidence_level: 0.95
    conditions_on_fixed_calibration_scores: true
    registered_seeds_are_averaged_within_engine_before_resampling: true
  practical_coverage_shift_reference: 0.03
  interpretation: planning_reference_not_binary_success_gate

panels:
  kill_protocol_sensitivity:
    source_register: results/KILL_TEST_STATUS.csv
    expected_source_runs: 120
    methods: [residual_split_cp]
    contrasts:
      - linear_uncapped_minus_piecewise_125_holding_sensor_set
      - common_14_minus_all_21_holding_rul_label
  unified_reference:
    source_register: results/UNIFIED_GRID_STATUS.csv
    expected_source_runs: 160
    mapping:
      point: residual_split_cp
      quantile: cqr
    paired_method_contrast: cqr_minus_residual_split_cp
    cqr_secondary_diagnostic: calibrated_cqr_minus_uncalibrated_q10_q90

missing_data_policy:
  no_imputation: true
  source_run_missing_or_invalid: fail_registered_cell_and_stop
  empty_calibration_or_test: fail_registered_cell_and_stop
  nonfinite_score_or_bound: fail_registered_cell_and_stop
  duplicate_or_existing_output: refuse_overwrite
  incomplete_panel_analysis: mark_package_inconclusive_until_same_registration_completed

outputs:
  per_cell_root: results/uq_reference
  calibration_scores: calibration_scores.parquet
  test_intervals: intervals_test.parquet
  cell_meta: meta.json
  cell_summary: summary.json
  aggregate_cell_summary: results/uq_reference/UQ_REFERENCE_CELL_SUMMARY.csv
  protocol_contrasts: results/uq_reference/UQ_PROTOCOL_CONTRASTS.csv
  method_comparisons: results/uq_reference/UQ_METHOD_COMPARISONS.csv
  cqr_calibration_effects: results/uq_reference/UQ_CQR_CALIBRATION_EFFECTS.csv
  aggregate_summary: results/uq_reference/UQ_REFERENCE_SUMMARY.json
  result_report: project/TOPIC6_WORK_PACKAGE_6B_RESULT.md
  figure: paper/figures/FIG_UQ_REFERENCE_ARM.png

