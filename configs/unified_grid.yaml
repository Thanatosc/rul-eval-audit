protocol:
  version: unified_v1
  document: protocols/unified_v1.md
  split_allocation_unit: engine_unit
  split_fractions:
    train: 0.70
    val: 0.15
    calib: 0.15
  calibration_role: never_used_for_training_or_tuning
  prediction_splits: [val, calib, test]

dataset_provenance:
  dataset: C-MAPSS
  archive_file: data/raw/C-MAPSS_Turbofan.zip
  archive_sha256: c9c5dec12a945a82e8bb4446589d7fb3cc057b5e5d81fa1a12e25ee9912ad3b2
